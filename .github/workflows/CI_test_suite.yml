name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Python Check for ML Pipeline
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # update with whatever python version is needed
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Syntax Check (Simple Bugs)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Java Check for Spring Boot API
  java-build: # We may be able to comment all of this out for a minute until maven/ the build is properly set up. Though that should be one of the first things setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Same thing here! Chnage java version if needed
          distribution: 'temurin'
      - name: Compile Code
        run: |
          # This assumes you will use Maven (mvnw) or Gradle (gradlew)
          # For now, it will fail if these files don't exist, which is a "run check"
          # If no 
          if [ -f "./mvnw" ]; then ./mvnw compile; fi

  # Flutter Check for Frontend
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Analyze Syntax
        run: |
          # Checks for broken references or syntax errors in Dart
          if [ -d "frontend" ]; then flutter analyze; fi
