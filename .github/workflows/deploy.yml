name: Flutter Web Build and Deploy

# This tells GitHub to run this workflow whenever you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      # Check out your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up the Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Uses the latest stable Flutter release

      # Securely create the .env file using GitHub Secrets
      - name: Create .env file
        run: |
          echo "MESSAGING_SENDER_ID=${{ secrets.MESSAGING_SENDER_ID }}" >> .env
          echo "WEB_API_KEY=${{ secrets.WEB_API_KEY }}" >> .env
          echo "WEB_APP_ID=${{ secrets.WEB_APP_ID }}" >> .env
          echo "WEB_MEASUREMENT_ID=${{ secrets.WEB_MEASUREMENT_ID }}" >> .env
          echo "ANDROID_API_KEY=${{ secrets.ANDROID_API_KEY }}" >> .env
          echo "ANDROID_APP_ID=${{ secrets.ANDROID_APP_ID }}" >> .env
          echo "IOS_API_KEY=${{ secrets.IOS_API_KEY }}" >> .env
          echo "IOS_APP_ID=${{ secrets.IOS_APP_ID }}" >> .env
          echo "IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}" >> .env
          
      # Install your Flutter dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Build the Web App using the injected .env file
      - name: Build Web
        run: flutter build web --dart-define-from-file=.env

      # Save the build folder as an artifact (so you can download or deploy it)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
